project_id = "delherren"

[functions]
  # Appelees par le navigateur sans session : pas de JWT requis, la
  # validation est faite dans la fonction elle-meme.
  [functions.create-booking]
    verify_jwt = false
  [functions.cancel-booking]
    verify_jwt = false

  # Appelee par le dashboard avec le JWT de l'admin ; la fonction verifie
  # is_admin() avant d'agir.
  [functions.send-booking-update]
    verify_jwt = true

  # Fonctions internes : appelees uniquement avec le bearer service role
  # (par une autre fonction ou par pg_cron).
  [functions.send-booking-confirmation]
    verify_jwt = true
  [functions.send-telegram-notification]
    verify_jwt = true
  [functions.process-reminders]
    verify_jwt = true
